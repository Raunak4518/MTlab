[project]
name = "mtlab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "raunak", email = "u24ai109@aid.svnit.ac.in" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.1.0",
    "indicnlp>=0.0.1",
    "nltk>=3.10.4",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "sacremoses>=0.2.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
data = [
    "datasets>=5.1.0",
    "huggingface-hub>=2.4.0",
    "pyarrow>=26.0.1",
    "tqdm>=4.70.1",
]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
experiment = [
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "nvidia-ml-py>=13.615.71",
    "psutil>=7.2.2",
]
experiments = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "psutils>=3.3.11",
]
preprocessing = [
    "indic-nlp-library>=0.92",
    "sacremoses>=0.2.0",
]
research = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "nltk>=3.10.4",
    "plotly>=7.1.0",
    "sacrebleu>=2.6.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
